name: Repository checks

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: python -m pip install pre-commit==4.6.2

      - name: Run repository checks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Check PR commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git rev-list "$BASE_SHA..$HEAD_SHA" | while read -r commit; do
            echo "Checking commit $commit"
            git show -s --format=%B "$commit" > "$RUNNER_TEMP/commit-message"
            pre-commit run --hook-stage commit-msg \
              --commit-msg-filename "$RUNNER_TEMP/commit-message"
          done
