default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: test-repository
        name: Test workflow and commit policy (offline)
        entry: python -m unittest discover -s scripts -p test_*.py -v
        language: python
        additional_dependencies:
          - PyYAML==6.0.2
        pass_filenames: false
        always_run: true

      - id: check-commit-message
        name: Check Conventional Commit and DCO sign-off
        entry: python scripts/check_commit_message.py
        language: python
        stages: [commit-msg]
