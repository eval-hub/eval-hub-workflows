default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: [--maxkb=500, --enforce-all]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: actionlint
        name: Lint workflows with actionlint and ShellCheck
        entry: actionlint
        language: python
        additional_dependencies:
          - actionlint-py==1.7.7.24
          - shellcheck-py==0.11.0.1
        types: [yaml]
        files: ^\.github/workflows/

      - id: check-action-pins
        name: Require immutable GitHub Action references
        entry: python scripts/check_action_pins.py
        language: python
        additional_dependencies:
          - PyYAML==6.0.2
        files: '(^\.github/workflows/.*\.ya?ml$|(^|/)action\.ya?ml$)'

      - id: test-repository
        name: Test workflow and repository policies (offline)
        entry: python -m unittest discover -s scripts -p test_*.py -v
        language: python
        additional_dependencies:
          - PyYAML==6.0.2
        pass_filenames: false
        always_run: true

      - id: check-commit-message
        name: Check Conventional Commit and DCO sign-off
        entry: python scripts/check_commit_message.py
        language: python
        stages: [commit-msg]
